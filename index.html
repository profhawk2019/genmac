    To position the **Historical Account** tab directly beside the **All Records** tab, you will need to update the tab sequence within your user interface layout or spreadsheet structure. 

**Steps to Rearrange Tabs**

* **Spreadsheets (Excel / Google Sheets):**
  * Click and hold the tab labeled **Historical Account**.
  * Drag it along the bottom tab bar until it is placed directly to the right of the **All Records** tab.
  * Release the mouse button to drop it into place.

* **Web Applications / Custom Interfaces (HTML/CSS):**
  * Locate the container holding your navigation tabs in the source code.
  * Move the `<div>` or `<li>` element for **Historical Account** directly below the element for **All Records**.

```html
<!-- Example HTML Placement -->
<div class="tab-container">
  <button class="tab">All Records</button>
  <button class="tab">Historical Account</button> <!-- Placed beside All Records -->
  <button class="tab">Other Tab</button>
</div>
